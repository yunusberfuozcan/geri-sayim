# XcodeGen projesi: DEVELOPMENT_TEAM=<TeamID> xcodegen generate
name: GeriSayim
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  GeriSayimMac:
    type: application
    platform: macOS
    sources: [Mac, Shared]
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Geri Sayım
        LSUIElement: true
    entitlements:
      path: Mac/GeriSayim.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.berfu.gerisayim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berfu.gerisayim
        PRODUCT_NAME: GeriSayim

  GeriSayimiOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - target: GeriSayimWidget
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Geri Sayım
        UILaunchScreen: {}
    entitlements:
      path: iOS/GeriSayim.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.berfu.gerisayim
        com.apple.security.application-groups: [group.com.berfu.gerisayim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berfu.gerisayim
        PRODUCT_NAME: GeriSayim
        TARGETED_DEVICE_FAMILY: "1"

  GeriSayimWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Geri Sayım
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/GeriSayimWidget.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.berfu.gerisayim
        com.apple.security.application-groups: [group.com.berfu.gerisayim]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berfu.gerisayim.widget
        PRODUCT_NAME: GeriSayimWidget
